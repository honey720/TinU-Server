name: Create Jira issue
on:
  issues:
    types:
      - opened
jobs:
  create-issue:
    name: Create Jira issue
    runs-on: ubuntu-latest
    steps:
      - name: Login
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Issue Parser
        uses: stefanbuck/github-issue-praser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/feature.yml

      - name: Log Issue Parser
        run: |
          echo '${{ steps.issue-parser.outputs.jsonString }}'
          echo "Branch Name : ${{ steps.issue-parser.outputs.issueparser_branch }}"
          echo "checkbox : ${{ steps.issue-parser.outputs.issueparser_without_jira_issue }}"
          echo "Period : ${{ steps.issue-parser.outputs.issueparser_period }}"
          echo " ${{ steps.issue-parser.outputs}}"
          echo "START_DATE : $(date +%F)" >> $GITHUB_ENV
          echo "FUTURE_DATE=$(date -d '+7 days' +%F)"
          echo "DUE_DATE=$(date -d "${{ steps.issue-parser.outputs.issueparser_period }} days" +%F)" >> $GITHUB_ENV

      - name: Convert markdown to Jira Syntax
        if: ${{ steps.issue-parser.outputs.issueparser_without_jira_issue != '등록하지 않을래요.' }}
        uses: peter-evans/jira2md@v1
        id: md2jira
        with:
          input-text: |
            ### Github Issue Link
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          mode: md2jira
          
      - name: Create Issue
        if: ${{ steps.issue-parser.outputs.issueparser_is_only_branch != '등록하지 않을래요.' }}
        id: create
        uses: atlassian/gajira-create@v3
        with:
          project: TINU
          issuetype: SERVER
          summary: "${{ github.event.issue.title }}"
          description: "${{ steps.md2jira.outputs.output-text }}"
          fields: '{"parent": { "key": "TINU-51" }, "customfield_10015": "${{ env.START_DATE }}", "duedate": "${{ env.DUE_DATE }}"}'

      - name: Log created issue
        if: ${{ steps.issue-parser.outputs.issueparser_is_only_branch != '등록하지 않을래요.' }}
        run: echo "Jira Issue ${{ steps.issue-parser.outputs.parentKey }}/${{ steps.create.outputs.issue }} was created"

      - name: Checkout develop code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create branch with Ticket number
        if: ${{ steps.issue-parser.outputs.issueparser_is_only_branch != '_No response_' }}
        run: |
          BRANCH_NAME="${{ steps.create.outputs.issue }}/${{ steps.issue-parser.outputs.issueparser_branch }}"
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME

      - name: Update issue title
        if: ${{ steps.issue-parser.outputs.issueparser_is_only_branch != '등록하지 않을래요.' }}
        uses: actions-cool/issues-helper@v3
        with:
          actions: "update-issue"
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "${{ steps.create.outputs.issue }} ${{ github.event.issue.title }}"
