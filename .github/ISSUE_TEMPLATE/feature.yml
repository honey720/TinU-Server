name: '⭐Feature'
description: 'Feature 작업 시 입력해주세요.'
labels: [⭐ Feature]
title: '⭐ [Feature] : '
body:
  - type: input
    id: branch
    attributes:
      label: '브랜치 이름 (Branch Name)'
      description: '생성할 브랜치 이름을 작성해주세요. 브랜치 생성을 원치 않으시면 비워두세요.'
      placeholder: 'chat-service'
    validations:
      required: false

  - type: checkboxes
    id: without_jira_issue
    attributes:
      label: '지라 이슈 해제'
      description: '체크하면 지라 이슈와 이슈 티켓 넘버가 생성되지 않아요.'
      options:
        - label: 지라 이슈를 생성하지 않을래요.

  - type: input
    id: description
    attributes:
      label: '이슈 내용(Description)'
      description: '기능에 대해서 간략히 설명해주세요'
    validations:
      required: false

  - type: input
    id: period
    attributes:
      label: '개발 기간 (Period)'
      description: '개발 기간을 입력하세요. 비워두시면 1일로 설정됩니다.'
      placeholder: '1'
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: '체크리스트(Tasks)'
      description: '해당 이슈에 대해 필요한 작업목록을 작성해주세요'
      value: |
        - [ ] 
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: '참조(References)'
      description: '해당 이슈과 관련된 레퍼런스를 참조해주세요'
    validations:
      required: false
